<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Manifold Abierto — Status Próximo Capítulo</title>
<template id="__bundler_thumbnail"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 56"><rect width="120" height="56" fill="#0a1420"/><circle cx="60" cy="28" r="16" fill="#2ABFBF"/><text x="60" y="33" font-size="14" fill="#0a1420" text-anchor="middle" font-family="sans-serif" font-weight="700">M</text></svg></template>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Syne:wght@600;700;800&family=DM+Sans:wght@400;500;700&family=Space+Mono:wght@400;700&display=swap');
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{background:#05090f;height:100%;width:100%;overflow:hidden}
  #root{width:100%;height:100%;display:flex;align-items:center;justify-content:center}
</style>
</head>
<body>
<div id="root"></div>
<script>
window.OM_SCENES = '[{"name":"Logo","dur":1.6,"desc":"Manifold Abierto logo fades and scales in, centered, then fades down"},{"name":"Grid","dur":1.2,"desc":"Blueprint grid and scanline fade in over dark background"},{"name":"Waveform","dur":1.8,"desc":"Audio waveform bars rise up and pulse across the middle"},{"name":"Title","dur":2.6,"desc":"EP 03 tag stamps in, then title and guest name type/slide into place"},{"name":"Guest","dur":2.4,"desc":"Marcelo Lima / Sanhua card slides up with initials badge"},{"name":"CTA","dur":2.0,"desc":"Próximamente + link prompt settles at the bottom, logo mark pulses"}]';
window.OM_PLAYBACK = '{"mode":"loop"}';
</script>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script type="text/babel" src="animations-v3.jsx"></script>
<script type="text/babel">
const { useComposition, CompositionStage, Shot, Easing, animate, interpolate, clamp } = window;
const W = 1080, H = 1920;
const TEAL = '#2ABFBF', ORANGE = '#F07A2A', INK = '#05090f', PAPER = '#eef5fa';

function LogoIntro({ T, CUES }) {
  const inOp = animate({ from:0, to:1, start:CUES.Logo, end:CUES.Logo+0.5, ease:Easing.easeOutCubic })(T);
  const outOp = animate({ from:1, to:0, start:CUES.Grid-0.5, end:CUES.Grid, ease:Easing.easeInCubic })(T);
  const scale = animate({ from:0.82, to:1, start:CUES.Logo, end:CUES.Logo+0.6, ease:Easing.easeOutBack })(T);
  return (
    <div style={{ position:'absolute', inset:0, display:'flex', flexDirection:'column', alignItems:'center', justifyContent:'center', gap:'26px', opacity: Math.min(inOp, outOp), transform:`scale(${scale})` }}>
      <img src="../../assets/logo.png" alt="Manifold Abierto" style={{ width:'260px', height:'260px', objectFit:'contain' }}/>
      <div style={{ fontFamily:"'Syne',sans-serif", fontWeight:800, fontSize:'54px', color: PAPER, letterSpacing:'0.02em' }}>MANIFOLD ABIERTO</div>
      <div style={{ fontFamily:"'Space Mono',monospace", fontSize:'24px', color: TEAL, letterSpacing:'0.08em' }}>PODCAST HVAC · LATAM</div>
    </div>
  );
}

function BlueprintGrid({ T }) {
  const op = animate({ from:0, to:0.22, start:0, end:1.2, ease:Easing.easeOutCubic })(T);
  return (
    <svg width={W} height={H} style={{ position:'absolute', inset:0, opacity:op }}>
      <defs>
        <pattern id="grid" width="60" height="60" patternUnits="userSpaceOnUse">
          <path d="M 60 0 L 0 0 0 60" fill="none" stroke={TEAL} strokeWidth="1"/>
        </pattern>
      </defs>
      <rect width={W} height={H} fill="url(#grid)"/>
    </svg>
  );
}

function Scanline({ T }) {
  const y = interpolate([0, 6], [-200, H+200], Easing.linear)(T % 6);
  return <div style={{ position:'absolute', left:0, top:y, width:W, height:120, background:`linear-gradient(180deg, transparent, rgba(42,191,191,0.08), transparent)`, pointerEvents:'none' }}/>;
}

function Waveform({ T, CUES }) {
  const bars = 28;
  const rise = animate({ from:0, to:1, start:CUES.Waveform, end:CUES.Waveform+0.9, ease:Easing.easeOutBack })(T);
  return (
    <div style={{ position:'absolute', left:0, top:H*0.30, width:W, height:180, display:'flex', alignItems:'center', justifyContent:'center', gap:'10px' }}>
      {Array.from({length:bars}).map((_,i)=>{
        const seed = Math.sin(i*12.9898)*43758.5453 % 1;
        const base = 24 + Math.abs(seed)*130;
        const wob = Math.sin(T*3 + i*0.7) * 18;
        const h = clamp((base + wob) * rise, 6, 170);
        const mid = Math.abs(i - bars/2) < 3;
        return <div key={i} style={{ width:'14px', height:h+'px', borderRadius:'4px', background: mid ? ORANGE : TEAL, opacity: 0.5 + rise*0.5, transition:'none' }}/>;
      })}
    </div>
  );
}

function EpTag({ T, CUES }) {
  const in1 = animate({ from:0, to:1, start:CUES.Title, end:CUES.Title+0.4, ease:Easing.easeOutBack })(T);
  return (
    <div style={{
      position:'absolute', left:0, top:H*0.42, width:W, display:'flex', justifyContent:'center',
      opacity: in1, transform:`translateY(${(1-in1)*30}px)`
    }}>
      <div style={{
        fontFamily:"'Space Mono',monospace", fontSize:'30px', fontWeight:700, letterSpacing:'0.12em',
        color: INK, background: ORANGE, padding:'10px 32px', borderRadius:'999px'
      }}>PRÓXIMO CAPÍTULO · EP 02</div>
    </div>
  );
}

function TitleBlock({ T, CUES }) {
  const in1 = animate({ from:0, to:1, start:CUES.Title+0.35, end:CUES.Title+1.0, ease:Easing.easeOutCubic })(T);
  return (
    <div style={{
      position:'absolute', left:0, top:H*0.48, width:W, padding:'0 90px', textAlign:'center',
      opacity: in1, transform:`translateY(${(1-in1)*24}px)`
    }}>
      <div style={{ fontFamily:"'Syne',sans-serif", fontWeight:800, fontSize:'68px', lineHeight:1.08, color: PAPER }}>
        Sanhua: la empresa china que está en todos los sistemas
      </div>
    </div>
  );
}

function GuestCard({ T, CUES }) {
  const in1 = animate({ from:0, to:1, start:CUES.Guest, end:CUES.Guest+0.7, ease:Easing.easeOutBack })(T);
  return (
    <div style={{
      position:'absolute', left:0, top:H*0.68, width:W, display:'flex', justifyContent:'center',
      opacity: in1, transform:`translateY(${(1-in1)*50}px)`
    }}>
      <div style={{
        display:'flex', alignItems:'center', gap:'24px', background:'rgba(42,191,191,0.08)',
        border:'1px solid rgba(42,191,191,0.35)', borderRadius:'20px', padding:'22px 34px', maxWidth:'860px'
      }}>
        <div style={{
          width:'88px', height:'88px', borderRadius:'50%', background:'#74b9ff', flexShrink:0,
          display:'flex', alignItems:'center', justifyContent:'center',
          fontFamily:"'Syne',sans-serif", fontWeight:800, fontSize:'34px', color: INK
        }}>ML</div>
        <div>
          <div style={{ fontFamily:"'Syne',sans-serif", fontWeight:700, fontSize:'36px', color: PAPER }}>Marcelo Lima</div>
          <div style={{ fontFamily:"'DM Sans',sans-serif", fontSize:'26px', color: 'rgba(238,245,250,0.65)' }}>Sales Manager LATAM · Sanhua International</div>
        </div>
      </div>
    </div>
  );
}

function CTA({ T, CUES }) {
  const in1 = animate({ from:0, to:1, start:CUES.CTA, end:CUES.CTA+0.6, ease:Easing.easeOutCubic })(T);
  const pulse = 1 + Math.sin(T*4)*0.06;
  return (
    <div style={{
      position:'absolute', left:0, bottom:'110px', width:W, display:'flex', flexDirection:'column',
      alignItems:'center', gap:'22px', opacity: in1
    }}>
      <div style={{
        width:'20px', height:'20px', borderRadius:'50%', background: TEAL,
        transform:`scale(${pulse})`, boxShadow:`0 0 40px ${TEAL}`
      }}/>
      <div style={{ fontFamily:"'Syne',sans-serif", fontWeight:700, fontSize:'42px', color: PAPER, letterSpacing:'0.02em' }}>MANIFOLD ABIERTO</div>
      <div style={{ fontFamily:"'Space Mono',monospace", fontSize:'26px', color: ORANGE }}>Muy pronto en manifoldabierto.vercel.app</div>
    </div>
  );
}

function Piece() {
  const { T, CUES } = useComposition();
  return (
    <div style={{ position:'relative', width:W, height:H, background: INK, overflow:'hidden', fontFamily:"'DM Sans',sans-serif" }}>
      <Shot from={CUES.Logo} to={CUES.Grid}><LogoIntro T={T} CUES={CUES}/></Shot>
      <Shot from={CUES.Grid} to={CUES.CTA+2.0}><BlueprintGrid T={T-CUES.Grid}/></Shot>
      <Shot from={CUES.Grid} to={CUES.CTA+2.0}><Scanline T={T}/></Shot>
      <Shot from={CUES.Waveform} to={CUES.CTA+2.0}><Waveform T={T} CUES={CUES}/></Shot>
      <Shot from={CUES.Title} to={CUES.CTA+2.0}><EpTag T={T} CUES={CUES}/></Shot>
      <Shot from={CUES.Title} to={CUES.CTA+2.0}><TitleBlock T={T} CUES={CUES}/></Shot>
      <Shot from={CUES.Guest} to={CUES.CTA+2.0}><GuestCard T={T} CUES={CUES}/></Shot>
      <Shot from={CUES.CTA} to={CUES.CTA+2.0}><CTA T={T} CUES={CUES}/></Shot>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(
  <CompositionStage width={W} height={H} scenes={window.OM_SCENES} playback={window.OM_PLAYBACK} bg="#05090f">
    <Piece/>
  </CompositionStage>
);
</script>
</body>
</html>
